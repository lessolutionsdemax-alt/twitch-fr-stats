name: twitch-fr-collect

on:
  schedule:
    - cron: "13,43 * * * *"   # toutes les 30 min (UTC). GitHub peut décaler de quelques minutes.
  workflow_dispatch:          # bouton "Run workflow" pour tester à la main

concurrency:
  group: twitch-collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet requests

      - name: Collecte
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_LANG: fr
          MIN_VIEWERS: "100"
        run: python collect.py

      - name: Commit des données
        run: |
          git config user.name "twitch-collector"
          git config user.email "twitch-collector@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Rien à committer"; exit 0
          fi
          git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
